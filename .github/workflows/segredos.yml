name: Segredos

# Procura chaves, senhas e tokens vazados em todo o histórico do Git.
# Se achar algo: troque o segredo (não basta apagar o commit).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
