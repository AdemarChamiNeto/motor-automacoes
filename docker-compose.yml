services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres-dev
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
